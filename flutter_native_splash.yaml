# 스플래시 화면 (리디자인): 밝은 바탕 가운데 "music is life." 로고
#
# 로고 이미지는 앱 글꼴로 그려서 만든다.
#   flutter test tool/splash --update-goldens   # assets/splash/*.png 다시 그리기
#   dart run flutter_native_splash:create       # iOS·Android 스플래시 다시 만들기
#
# 예전에는 정사각형 로고 그림을 화면 전체 배경(background_image)으로 써서
# 세로로 긴 화면에서 늘어나거나 잘려 보였다.
flutter_native_splash:
  # 앱 바탕색 (AppColorTokens.light.background)
  color: "#F4F4F5"
  # 4배 밀도로 그린 로고 (화면에서 약 250pt 폭)
  image: assets/splash/splash_logo.png

  # 앱은 아직 라이트 테마만 쓰므로 다크 모드에서도 같은 화면을 보여준다.
  color_dark: "#F4F4F5"
  image_dark: assets/splash/splash_logo.png

  # Android 12+는 화면 가운데 원 안에 아이콘 크기로만 그린다. (1152×1152, 지름 768 원 안)
  android_12:
    color: "#F4F4F5"
    image: assets/splash/splash_logo_android12.png
    color_dark: "#F4F4F5"
    image_dark: assets/splash/splash_logo_android12.png

  web: false
