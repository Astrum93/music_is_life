allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}

// 오래된 플러그인 호환 처리
// - AGP 8+는 namespace가 필수라서, namespace를 선언하지 않은 플러그인에 group을 넣어준다.
// - 최신 androidx 의존성은 compileSdk 33 이상이 필요해서, 낮은 compileSdk를 36으로 올린다.
subprojects {
    plugins.withId("com.android.library") {
        android {
            if (namespace == null) {
                namespace project.group.toString()
            }
        }
        project.androidComponents.finalizeDsl { ext ->
            if (ext.compileSdk != null && ext.compileSdk < 33) {
                ext.compileSdk = 36
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
